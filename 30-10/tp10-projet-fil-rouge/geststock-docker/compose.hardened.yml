x-hardening: &hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  socket-proxy:
    <<: *hardening

  traefik:
    <<: *hardening
    tmpfs:
      - /tmp:uid=65534,gid=65534,mode=0700

  app:
    <<: *hardening
    tmpfs:
      - /tmp:uid=33,gid=33,mode=0700,size=64m
      - /var/run/apache2:uid=33,gid=33,mode=0700,size=1m
      - /var/lock/apache2:uid=33,gid=33,mode=0700,size=1m

  rapport:
    <<: *hardening
    tmpfs:
      - /tmp:uid=33,gid=33,mode=0700,size=16m

  db:
    <<: *hardening
    tmpfs:
      - /run/mysqld:uid=999,gid=999,mode=0755,size=1m
      - /tmp:uid=999,gid=999,mode=0700,size=64m
