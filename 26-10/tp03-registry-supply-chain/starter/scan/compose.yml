name: shop-scan

services:
  trivy:
    image: aquasec/trivy:0.69.1
    restart: unless-stopped
    command: ["server", "--listen", "0.0.0.0:4954", "--cache-dir", "/cache", "--token", "${TRIVY_TOKEN:?lancer ./init.sh}"]
    ports:
      - "4954:4954"
    volumes:
      - trivy-db:/cache
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4954/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3

  db-update:
    image: aquasec/trivy:0.69.1
    profiles: ["update"]
    command: ["image", "--download-db-only", "--cache-dir", "/cache"]
    volumes:
      - trivy-db:/cache

volumes:
  trivy-db:
