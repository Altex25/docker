name: shop-b5

include:
  - path: data/compose.yml
  - path: edge/compose.yml

services:
  api:
    image: registry.local:5000/shopapi:1.4.3
    restart: unless-stopped
    environment:
      DATABASE_USER: shop
      DATABASE_NAME: shop
      DATABASE_HOST: db
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: --require /etc/shop/db-url.cjs
    configs:
      - source: db-url-node
        target: /etc/shop/db-url.cjs
    secrets:
      - db_password
    networks:
      - front
      - back
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.api-b5.rule: Host(`api.localhost`)
      traefik.http.services.api-b5.loadbalancer.server.port: "3000"

configs:
  db-url-node:
    file: ../config/db-url.cjs
