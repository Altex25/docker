services:
  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine-d257e5d@sha256:08e7b70879af45a89305b91f4600cfbc88da2419a65948df870cddb082b8cf83
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_EXTRA_OPTS: -Z6 --format=custom
      BACKUP_SUFFIX: .dump
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    secrets:
      - db_password
    volumes:
      - ./backups:/backups
    networks:
      - back
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${HEALTHCHECK_PORT}/ || exit 1"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s
