name: shop

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 30s
  start_interval: 1s

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *logging

x-db-client-env: &db-client-env
  DATABASE_USER: shop
  DATABASE_NAME: shop
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  DATABASE_PASSWORD_FILE: /run/secrets/db_password
  REDIS_URL: redis://redis:6379

services:
  traefik:
    <<: *service-defaults
    image: traefik:v3.6.25@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    environment:
      TRAEFIK_PROVIDERS_DOCKER: "true"
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: shop_front
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      TRAEFIK_PING: "true"
      TRAEFIK_ACCESSLOG: "true"
      TRAEFIK_ACCESSLOG_FORMAT: json
      TRAEFIK_LOG_LEVEL: INFO
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - front
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "traefik", "healthcheck", "--ping"]

  db:
    <<: *service-defaults
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - back
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shop", "-d", "shop"]

  redis:
    <<: *service-defaults
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - back
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]

  api:
    <<: *service-defaults
    image: shop/shopapi:dev
    build:
      context: ./apps/shopapi
    environment:
      <<: *db-client-env
      NODE_OPTIONS: --require /etc/shop/db-url.cjs
      LOG_LEVEL: info
    configs:
      - source: db-url-node
        target: /etc/shop/db-url.cjs
    secrets:
      - db_password
    networks:
      - front
      - back
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    healthcheck: *healthcheck-defaults
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: Host(`api.localhost`)
      traefik.http.routers.api.entrypoints: web
      traefik.http.services.api.loadbalancer.server.port: "3000"
      traefik.http.services.api.loadbalancer.healthcheck.path: /ready
      traefik.http.services.api.loadbalancer.healthcheck.interval: 5s
      traefik.http.services.api.loadbalancer.healthcheck.timeout: 2s

  worker:
    <<: *service-defaults
    image: shop/shop-worker:dev
    build:
      context: ./apps/shop-worker
      secrets:
        - pipconf
    environment:
      <<: *db-client-env
      PYTHONPATH: /etc/shop/python
      LOG_LEVEL: INFO
    configs:
      - source: db-url-python
        target: /etc/shop/python/sitecustomize.py
    secrets:
      - db_password
    networks:
      - back
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    healthcheck: *healthcheck-defaults

  adminer:
    <<: *service-defaults
    image: adminer:4.8.1@sha256:34d37131366c5aa84e1693dbed48593ed6f95fb450b576c1a7a59d3a9c9e8802
    profiles:
      - tools
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - front
      - back
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.adminer.rule: Host(`adminer.localhost`)
      traefik.http.routers.adminer.entrypoints: web
      traefik.http.services.adminer.loadbalancer.server.port: "8080"

  migrate:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    profiles:
      - ops
    restart: "no"
    logging: *logging
    environment:
      MIGRATION: ${MIGRATION:-}
      PGHOST: db
      PGUSER: shop
      PGDATABASE: shop
    secrets:
      - db_password
    volumes:
      - ./db/migrations:/migrations:ro
    networks:
      - back
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-ec"]
    command:
      - |
        test -n "$$MIGRATION" || { echo "MIGRATION=<fichier.sql> est obligatoire" >&2; exit 2; }
        test -f "/migrations/$$MIGRATION" || { echo "migration introuvable : $$MIGRATION" >&2; exit 2; }
        export PGPASSWORD="$$(cat /run/secrets/db_password)"
        psql -v ON_ERROR_STOP=1 --single-transaction -f "/migrations/$$MIGRATION"
        psql -At -c "SELECT version || ' ' || applied_at FROM schema_migrations ORDER BY applied_at"

networks:
  front: {}
  back:
    internal: true

volumes:
  pgdata: {}
  redisdata: {}

secrets:
  db_password:
    file: ./secrets/db_password.txt
  pipconf:
    file: ./apps/shop-worker/pip.conf

configs:
  db-url-node:
    file: ./config/db-url.cjs
  db-url-python:
    file: ./config/python/sitecustomize.py
