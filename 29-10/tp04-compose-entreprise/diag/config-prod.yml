name: shop
services:
  api:
    cap_drop:
      - ALL
    configs:
      - source: db-url-node
        target: /etc/shop/db-url.cjs
    depends_on:
      db:
        condition: service_healthy
        restart: true
        required: true
      redis:
        condition: service_healthy
        restart: true
        required: true
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: 0.5
          memory: "268435456"
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: shop
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      DATABASE_PORT: "5432"
      DATABASE_USER: shop
      LOG_LEVEL: info
      NODE_OPTIONS: --require /etc/shop/db-url.cjs
      REDIS_URL: redis://redis:6379
    healthcheck:
      timeout: 3s
      interval: 10s
      retries: 5
      start_period: 30s
      start_interval: 1s
    image: registry.local:5000/shopapi:1.4.3
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.entrypoints: web
      traefik.http.routers.api.rule: Host(`api.localhost`)
      traefik.http.services.api.loadbalancer.healthcheck.interval: 5s
      traefik.http.services.api.loadbalancer.healthcheck.path: /ready
      traefik.http.services.api.loadbalancer.healthcheck.timeout: 2s
      traefik.http.services.api.loadbalancer.server.port: "3000"
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      back: null
      front: null
    read_only: true
    restart: unless-stopped
    secrets:
      - source: db_password
        target: /run/secrets/db_password
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
  db:
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: 1
          memory: "536870912"
    environment:
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_USER: shop
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -h
        - 127.0.0.1
        - -U
        - shop
        - -d
        - shop
      timeout: 3s
      interval: 10s
      retries: 5
      start_period: 30s
      start_interval: 1s
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      back: null
    read_only: true
    restart: unless-stopped
    secrets:
      - source: db_password
        target: /run/secrets/db_password
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70,mode=0775
      - /tmp:uid=70,gid=70,mode=1777
    user: 70:70
    volumes:
      - type: volume
        source: pgdata
        target: /var/lib/postgresql/data
        volume: {}
      - type: bind
        source: /Users/alexandre/Desktop/Ynov/M2/Docker/docker/29-10/tp04-compose-entreprise/db/init.sql
        target: /docker-entrypoint-initdb.d/001-init.sql
        read_only: true
        bind: {}
  redis:
    cap_drop:
      - ALL
    command:
      - redis-server
      - --appendonly
      - "yes"
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: "268435456"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 3s
      interval: 10s
      retries: 5
      start_period: 30s
      start_interval: 1s
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      back: null
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: 999:1000
    volumes:
      - type: volume
        source: redisdata
        target: /data
        volume: {}
  traefik:
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: "134217728"
    environment:
      TRAEFIK_ACCESSLOG: "true"
      TRAEFIK_ACCESSLOG_FORMAT: json
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: :80
      TRAEFIK_LOG_LEVEL: INFO
      TRAEFIK_PING: "true"
      TRAEFIK_PROVIDERS_DOCKER: "true"
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: shop_front
    healthcheck:
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
      timeout: 3s
      interval: 10s
      retries: 5
      start_period: 30s
      start_interval: 1s
    image: traefik:v3.6.25@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      front: null
    ports:
      - mode: ingress
        target: 80
        published: "80"
        protocol: tcp
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind: {}
  worker:
    cap_drop:
      - ALL
    configs:
      - source: db-url-python
        target: /etc/shop/python/sitecustomize.py
    depends_on:
      db:
        condition: service_healthy
        restart: true
        required: true
      redis:
        condition: service_healthy
        restart: true
        required: true
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: "268435456"
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: shop
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      DATABASE_PORT: "5432"
      DATABASE_USER: shop
      LOG_LEVEL: INFO
      PYTHONPATH: /etc/shop/python
      REDIS_URL: redis://redis:6379
    healthcheck:
      timeout: 3s
      interval: 10s
      retries: 5
      start_period: 30s
      start_interval: 1s
    image: registry.local:5000/shop-worker:1.0.0
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      back: null
    read_only: true
    restart: unless-stopped
    secrets:
      - source: db_password
        target: /run/secrets/db_password
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
networks:
  back:
    name: shop_back
    internal: true
  front:
    name: shop_front
volumes:
  pgdata:
    name: shop_pgdata
  redisdata:
    name: shop_redisdata
secrets:
  db_password:
    name: shop_db_password
    file: /Users/alexandre/Desktop/Ynov/M2/Docker/docker/29-10/tp04-compose-entreprise/secrets/db_password.txt
configs:
  db-url-node:
    name: shop_db-url-node
    file: /Users/alexandre/Desktop/Ynov/M2/Docker/docker/29-10/tp04-compose-entreprise/config/db-url.cjs
  db-url-python:
    name: shop_db-url-python
    file: /Users/alexandre/Desktop/Ynov/M2/Docker/docker/29-10/tp04-compose-entreprise/config/python/sitecustomize.py
x-db-client-env:
  DATABASE_HOST: db
  DATABASE_NAME: shop
  DATABASE_PASSWORD_FILE: /run/secrets/db_password
  DATABASE_PORT: "5432"
  DATABASE_USER: shop
  REDIS_URL: redis://redis:6379
x-hardening:
  cap_drop:
    - ALL
  read_only: true
  security_opt:
    - no-new-privileges:true
x-healthcheck-defaults:
  interval: 10s
  retries: 5
  start_interval: 1s
  start_period: 30s
  timeout: 3s
x-logging:
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m
x-service-defaults:
  logging:
    driver: json-file
    options:
      max-file: "3"
      max-size: 10m
  restart: unless-stopped
