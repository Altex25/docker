global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s
  external_labels:
    environment: dev

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 3000
        refresh_interval: 10s
    relabel_configs:
      - target_label: service
        replacement: api
      - target_label: project
        replacement: shop

  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
        refresh_interval: 10s
    relabel_configs:
      - target_label: service
        replacement: worker
      - target_label: project
        replacement: shop

  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [container_label_com_docker_compose_project]
        target_label: project
      - regex: container_label_com_docker_compose_(service|project)
        action: labeldrop

  - job_name: observability
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: loki
      - targets: ["promtail:9080"]
        labels:
          service: promtail
      - targets: ["grafana:3000"]
        labels:
          service: grafana
      - targets: ["alertmanager:9093"]
        labels:
          service: alertmanager
