server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      - match:
          selector: '{service=~"api|worker"}'
          stages:
            - json:
                expressions:
                  level: level
            - template:
                source: severity
                template: >-
                  {{ if not .level }}unknown{{ else }}{{ $l := ToLower .level }}{{ if or (eq $l "60") (eq $l "critical") }}fatal{{ else if or (eq $l "50") (eq $l "error") }}error{{ else if or (eq $l "40") (eq $l "warning") }}warn{{ else if or (eq $l "30") (eq $l "info") }}info{{ else if or (eq $l "20") (eq $l "10") (eq $l "debug") }}debug{{ else }}unknown{{ end }}{{ end }}
            - labels:
                level:
                severity:
      - match:
          selector: '{service="traefik"}'
          stages:
            - json:
                expressions:
                  status: DownstreamStatus
            - template:
                source: status_class
                template: '{{ if .status }}{{ substr 0 1 .status }}xx{{ end }}'
            - labels:
                status_class:
