[SERVICE]
    Flush        1
    Log_Level    warn
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name    forward
    Listen  0.0.0.0
    Port    24224

[FILTER]
    Name    modify
    Match   *
    Rename  com.docker.compose.service service
    Rename  com.docker.compose.project project

[OUTPUT]
    Name             loki
    Match            *
    Host             loki
    Port             3100
    Labels           job=fluent-bit
    Label_Keys       $container_name,$service,$project,$source
    Remove_Keys      container_id
    Drop_Single_Key  raw
    Line_Format      key_value
