spring.application.name=crud-api
server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:dogsdb}
spring.datasource.username=${DB_USER:dogs}
spring.datasource.password=${DB_PASSWORD:dogspass}
spring.datasource.hikari.connection-timeout=3000

spring.jpa.hibernate.ddl-auto=update

logs.api.url=${LOGS_API_URL:http://localhost:8085}
